name: Build Signals patches MPP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'extensions/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/build-mpp.yml'

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build MPP
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GPR_KEY || secrets.GITHUB_TOKEN }}
        run: gradle --no-daemon :patches:build :patches:generatePatchesList

      - name: Locate MPP
        id: mpp
        run: |
          MPP=$(find patches/build -type f -name '*.mpp' | head -n1)
          echo "path=$MPP" >> "$GITHUB_OUTPUT"
          echo "Found: $MPP"
          test -n "$MPP"

      - uses: actions/upload-artifact@v4
        with:
          name: signals-auto-trading-mpp
          path: ${{ steps.mpp.outputs.path }}
          if-no-files-found: error

      - name: Create / update continuous release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: continuous
          body: |
            Automatic build of Signals Auto Trading patches.

            Add this source in Morphe Manager:
            https://morphe.software/add-source?github=MOD-PROD/signal-patch
          files: ${{ steps.mpp.outputs.path }}
          make_latest: true
          fail_on_unmatched_files: true
