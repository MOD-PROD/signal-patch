name: Build Signals patches MPP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'extensions/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/build-mpp.yml'

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build MPP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle --no-daemon :patches:build :patches:generatePatchesList
      - name: Verify MPP output
        run: |
          find patches/build -type f -name '*.mpp' -print
          test -n "$(find patches/build -type f -name '*.mpp' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: signals-auto-trading-mpp
          path: patches/build/**/*.mpp
          if-no-files-found: error
